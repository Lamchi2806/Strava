<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quay số lì xì</title>

<!-- Tailwind (dev only) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 p-10">

<div class="max-w-xl mx-auto bg-white p-6 rounded shadow">

<h2 class="text-xl font-bold mb-4">Tạo chương trình mới</h2>

<form id="createForm">

<input name="name" placeholder="Tên chương trình"
class="w-full border p-2 mb-2" required />

<input name="pin" placeholder="Mã PIN"
class="w-full border p-2 mb-2" />

<textarea name="description" placeholder="Mô tả"
class="w-full border p-2 mb-2"></textarea>

<textarea name="prizes"
placeholder="Ví dụ:
Nụ hôn,10
10.000 VND,20
50.000 VND,30
100.000 VND,40"
class="w-full border p-2 mb-2 h-40"></textarea>

<button type="submit"
class="bg-blue-500 text-white px-4 py-2 rounded">
Tạo ngay
</button>

</form>

<hr class="my-6">

<h2 class="text-xl font-bold mb-4">Quay thử</h2>

<input id="playerName" placeholder="Tên người chơi"
class="w-full border p-2 mb-2" />

<input id="playerAccount" placeholder="Số tài khoản"
class="w-full border p-2 mb-2" />

<button onclick="handleSpin()"
class="bg-green-500 text-white px-4 py-2 rounded">
Quay
</button>

</div>

<script>
/* ================= SUPABASE CONFIG ================= */

const supabaseClient = supabase.createClient(
    'https://nqxlwaitqcjurjuvurlr.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xeGx3YWl0cWNqdXJqdXZ1cmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3ODY1NjIsImV4cCI6MjA4NjM2MjU2Mn0.OBgHJu8o0P5TxA9y5St0kRxioAk4X551ntRIEw-HeWk'
);

let selectedSession = null;
let currentPrizes = [];

/* ================= CREATE SESSION ================= */

document.getElementById("createForm")
    .addEventListener("submit", handleCreateSession);

async function handleCreateSession(e) {
    e.preventDefault();

    const formData = new FormData(e.target);
    const name = formData.get('name')?.trim();
    const description = formData.get('description');
    const pin = formData.get('pin');
    const prizeInput = (formData.get('prizes') || "").trim();

    if (!name || !prizeInput) {
        alert("Thiếu thông tin");
        return;
    }

    const lines = prizeInput.split('\n').filter(l => l.trim() !== '');
    let totalRate = 0;
    let parsedPrizes = [];

    for (let line of lines) {
        const parts = line.split(',');
        if (parts.length !== 2) {
            alert("Sai format: " + line);
            return;
        }

        const prizeName = parts[0].trim();
        const rate = parseFloat(parts[1]);

        if (isNaN(rate) || rate <= 0) {
            alert("Rate không hợp lệ: " + line);
            return;
        }

        totalRate += rate;

        parsedPrizes.push({
            prize_name: prizeName,
            rate: rate
        });
    }

    if (totalRate !== 100) {
        alert("Tổng tỷ lệ phải = 100%. Hiện tại: " + totalRate);
        return;
    }

    /* Insert session */
    const { data: sessionData, error: sessionError } =
        await supabaseClient
            .from('lixi_sessions')
            .insert([{ name, description, pin }])
            .select()
            .single();

    if (sessionError) {
        console.error(sessionError);
        alert(sessionError.message);
        return;
    }

    selectedSession = sessionData;

    /* Insert prizes */
    const prizeRows = parsedPrizes.map(p => ({
        session_id: sessionData.id,
        prize_name: p.prize_name,
        rate: p.rate
    }));

    const { error: prizeError } =
        await supabaseClient
            .from('lixi_prizes')
            .insert(prizeRows);

    if (prizeError) {
        console.error(prizeError);
        alert(prizeError.message);
        return;
    }

    alert("Tạo thành công!");
    e.target.reset();
}

/* ================= LOAD PRIZES ================= */

async function loadPrizes() {

    const { data, error } = await supabaseClient
        .from('lixi_prizes')
        .select('*')
        .eq('session_id', selectedSession.id);

    if (error) {
        console.error(error);
        alert("Lỗi load prize");
        return;
    }

    currentPrizes = data;
}

/* ================= WEIGHTED RANDOM ================= */

function getWeightedPrize(prizes) {
    const rand = Math.random() * 100;
    let cumulative = 0;

    for (let p of prizes) {
        cumulative += parseFloat(p.rate);
        if (rand <= cumulative) {
            return p.prize_name;
        }
    }

    return prizes[prizes.length - 1].prize_name;
}

/* ================= SPIN ================= */

async function handleSpin() {

    if (!selectedSession) {
        alert("Chưa tạo session");
        return;
    }

    const name = document.getElementById("playerName").value;
    const account = document.getElementById("playerAccount").value;

    if (!name) {
        alert("Nhập tên người chơi");
        return;
    }

    await loadPrizes();

    if (!currentPrizes.length) {
        alert("Chưa có prize");
        return;
    }

    const prize = getWeightedPrize(currentPrizes);

    const { error } = await supabaseClient
        .from('lixi_winners')
        .insert([{
            session_id: selectedSession.id,
            name,
            account,
            prize
        }]);

    if (error) {
        console.error(error);
        alert("Lỗi lưu kết quả");
        return;
    }

    alert("🎉 Bạn trúng: " + prize);
}
</script>

</body>
</html>
