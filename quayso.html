<script>
const supabaseClient = supabase.createClient(
    'YOUR_SUPABASE_URL',
    'YOUR_SUPABASE_ANON_KEY'
);

let selectedSession = null;
let currentPrizes = [];

/* ================= CREATE SESSION ================= */

async function handleCreateSession(e) {
    e.preventDefault();

    const formData = new FormData(e.target);
    const name = formData.get('name').trim();
    const description = formData.get('description');
    const pin = formData.get('pin');
    const prizeInput = (formData.get('prizes') || "").trim();

    if (!name) {
        alert("Nhập tên chương trình");
        return;
    }

    if (!prizeInput) {
        alert("Nhập danh sách phần thưởng");
        return;
    }

    const lines = prizeInput.split('\n').filter(l => l.trim() !== '');
    let totalRate = 0;
    let parsedPrizes = [];

    for (let line of lines) {
        const parts = line.split(',');
        if (parts.length !== 2) {
            alert("Sai format: " + line);
            return;
        }

        const prizeName = parts[0].trim();
        const rate = parseFloat(parts[1]);

        if (isNaN(rate) || rate <= 0) {
            alert("Rate không hợp lệ: " + line);
            return;
        }

        totalRate += rate;

        parsedPrizes.push({
            prize_name: prizeName,
            rate: rate
        });
    }

    if (totalRate !== 100) {
        alert("Tổng tỷ lệ phải bằng 100%. Hiện tại = " + totalRate);
        return;
    }

    // Insert session
    const { data: sessionData, error: sessionError } =
        await supabaseClient
            .from('lixi_sessions')
            .insert([{ name, description, pin }])
            .select()
            .single();

    if (sessionError) {
        alert("Lỗi tạo session");
        return;
    }

    const sessionId = sessionData.id;

    // Insert prizes
    const prizeRows = parsedPrizes.map(p => ({
        session_id: sessionId,
        prize_name: p.prize_name,
        rate: p.rate
    }));

    const { error: prizeError } =
        await supabaseClient
            .from('lixi_prizes')
            .insert(prizeRows);

    if (prizeError) {
        alert("Lỗi lưu phần thưởng");
        return;
    }

    alert("Tạo thành công!");
    e.target.reset();
}

/* ================= LOAD PRIZES ================= */

async function loadPrizes(sessionId) {
    const { data, error } = await supabaseClient
        .from('lixi_prizes')
        .select('*')
        .eq('session_id', sessionId);

    if (error) {
        alert("Lỗi load prize");
        return;
    }

    currentPrizes = data;
}

/* ================= WEIGHTED RANDOM ================= */

function getWeightedPrize(prizes) {
    const rand = Math.random() * 100;
    let cumulative = 0;

    for (let p of prizes) {
        cumulative += parseFloat(p.rate);
        if (rand <= cumulative) {
            return p.prize_name;
        }
    }

    return prizes[prizes.length - 1].prize_name;
}

/* ================= SPIN ================= */

async function handleSpin(name, account) {
    if (!selectedSession) {
        alert("Chọn chương trình trước");
        return;
    }

    await loadPrizes(selectedSession.id);

    if (!currentPrizes || currentPrizes.length === 0) {
        alert("Chưa cấu hình prize");
        return;
    }

    const prize = getWeightedPrize(currentPrizes);

    // Save winner
    const { error } = await supabaseClient
        .from('lixi_winners')
        .insert([{
            session_id: selectedSession.id,
            name: name,
            account: account,
            prize: prize
        }]);

    if (error) {
        alert("Lỗi lưu kết quả");
        return;
    }

    alert("Chúc mừng! Bạn trúng: " + prize);
}
</script>
